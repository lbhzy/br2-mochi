image boot.vfat {
	size = 64M

    vfat {
        files = {
            "Image",
            "rk3582-rock-5c-lite.dtb",
        }
		file Image.bak {
            image = "Image"
        }
		file rk3582-rock-5c-lite.dtb.bak {
            image = "rk3582-rock-5c-lite.dtb"
        }
		file extlinux/extlinux.conf {
            image = "extlinux.conf"
        }
    }
}

image sdcard.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition uboot {
		in-partition-table = "false"
		image = "u-boot-rockchip.bin"
		offset = 32K
	}

	partition uboot-env {
		partition-type-uuid = 3de21764-95bd-54bd-a5c3-4abe786f38a8
		offset = 16M
		size = 64K
	}

	partition boot {
        partition-type-uuid = U
        image = "boot.vfat"
        offset = 17M
        bootable = true
    }

	partition rootfs {
		partition-type-uuid = L
		image = "rootfs.ext2"
	}
}